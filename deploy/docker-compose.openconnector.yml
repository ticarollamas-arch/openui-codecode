services:
  openconnector:
    image: ghcr.io/oomol-lab/open-connector:latest
    container_name: opencodelab-openconnector
    restart: unless-stopped
    env_file:
      - ./openconnector.env
    ports:
      # Exposto somente no loopback do VPS; publicar externamente via Nginx + HTTPS.
      - "127.0.0.1:30100:3000"
    volumes:
      - openconnector_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

volumes:
  openconnector_data:
